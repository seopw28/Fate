<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRIMAL TCG · VFX LAB</title>
  <link rel="stylesheet" href="vfx/lab/vfx-lab.css">
  <style>.vfx-sprite.cinematic{z-index:5;width:min(520px,72vw);height:min(520px,72vw);mix-blend-mode:screen;filter:drop-shadow(0 0 28px var(--preset-color,#fff));animation:cinematic-vfx 1s cubic-bezier(.18,.72,.2,1) both}@keyframes cinematic-vfx{0%{transform:translate(-50%,-50%) scale(.3) rotate(-12deg);opacity:0}18%{opacity:1}58%{transform:translate(-50%,-50%) scale(1.04) rotate(5deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1.13) rotate(10deg);opacity:0}}@media(prefers-reduced-motion:reduce){.vfx-sprite.cinematic{animation-duration:.5s}}</style>
</head>
<body>
  <header>
    <div><b>✦ PRIMAL TCG</b><span>VFX LAB · PRESET 01</span></div>
    <a href="./index.html">전투 화면으로</a>
  </header>
  <main>
    <section class="lab-stage">
      <div class="stage-head">
        <div><small>현재 프리셋</small><h1 id="preset-name">홍련 참격</h1><p id="preset-note">짧고 날카로운 근접 타격</p></div>
        <button id="replay">▶ 다시 재생 <kbd>Space</kbd></button>
      </div>
      <div class="arena" id="arena">
        <div class="combatant source" id="source"><div class="portrait">⚔</div><b>공격자</b><span>시전자 기준점</span></div>
        <div class="versus">VS</div>
        <div class="combatant target" id="target"><div class="portrait">◈</div><b>대상</b><span id="damage-label">피격 반응</span></div>
        <div class="vfx-layer" id="vfx-layer"></div>
      </div>
      <div class="timeline"><span>예고</span><i></i><span>이동</span><i></i><span>충돌</span><i></i><span>잔향</span></div>
    </section>
    <aside>
      <div class="aside-head"><small>EFFECT GRAMMAR</small><h2>18개 전투 프리셋</h2><p>속성 × 행동 × 강도 × 충돌 반응을 분리해 조합합니다.</p></div>
      <div class="filters" id="filters"></div>
      <div class="preset-list" id="preset-list"></div>
      <div class="spec" id="spec"></div>
    </aside>
  </main>
  <script src="vfx/presets/vfx-presets.js"></script>
  <script src="vfx/lab/vfx-engine.js"></script>
  <script src="vfx/lab/vfx-lab.js"></script>
</body>
</html>
