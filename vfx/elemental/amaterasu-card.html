<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>마법카드 — 아마테라스</title>
<style>
@font-face{font-family:'GmarketSans';font-weight:300;font-style:normal;font-display:swap;src:url('../../dist/assets/fonts/GmarketSansLight.ttf') format('truetype')}
@font-face{font-family:'GmarketSans';font-weight:500;font-style:normal;font-display:swap;src:url('../../dist/assets/fonts/GmarketSansMedium.ttf') format('truetype')}
@font-face{font-family:'GmarketSans';font-weight:700;font-style:normal;font-display:swap;src:url('../../dist/assets/fonts/GmarketSansBold.ttf') format('truetype')}

@font-face{font-family:'GmarketSans';font-weight:300;font-style:normal;font-display:swap;src:url('../../assets/fonts/GmarketSansLight.ttf') format('truetype')}
@font-face{font-family:'GmarketSans';font-weight:500;font-style:normal;font-display:swap;src:url('../../assets/fonts/GmarketSansMedium.ttf') format('truetype')}
@font-face{font-family:'GmarketSans';font-weight:700;font-style:normal;font-display:swap;src:url('../../assets/fonts/GmarketSansBold.ttf') format('truetype')}

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 30%, #1a1226 0%, #0b0710 70%); overflow: hidden; }
  body { display: grid; place-items: center; font-family: 'GmarketSans', 'Apple SD Gothic Neo', sans-serif; color: #e6dcef; user-select: none; }

  .stage { position: relative; width: 300px; height: 430px; perspective: 900px; }

  /* 카드 */
  .card {
    position: absolute; inset: 0; border-radius: 16px; cursor: pointer;
    background: linear-gradient(160deg, #241636 0%, #120a1e 55%, #1b0f2c 100%);
    border: 3px solid #8a6ad0;
    box-shadow: 0 0 0 2px #0b0710, 0 18px 40px rgba(0,0,0,.7), 0 0 18px rgba(138,106,208,.25);
    padding: 12px; display: flex; flex-direction: column; gap: 8px;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform .15s ease-out, box-shadow .5s, border-color .5s;
  }
  .stage.lit .card {
    border-color: #b48cff;
    box-shadow: 0 0 0 2px #0b0710, 0 18px 40px rgba(0,0,0,.7), 0 0 38px rgba(150,80,240,.65);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 0 2px #0b0710, 0 18px 40px rgba(0,0,0,.7), 0 0 56px rgba(150,80,240,.85); }
  }

  .head { display: flex; align-items: center; justify-content: space-between;
    padding: 5px 10px; border-radius: 8px; background: rgba(0,0,0,.45); border: 1px solid #4b3a74; }
  .name { font-weight: 700; font-size: 20px; letter-spacing: .25em; text-shadow: 0 0 8px #6a2ac8; }
  .cost { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font: 700 15px/1 'GmarketSans', 'Apple SD Gothic Neo', sans-serif; background: radial-gradient(circle at 35% 30%, #b48cff, #4a1f9a); box-shadow: 0 0 8px #7a3ae0; }

  /* 일러스트: 검은 태양(개기일식) */
  .art { position: relative; flex: 0 0 190px; border-radius: 8px; overflow: hidden; border: 1px solid #4b3a74;
    background: radial-gradient(ellipse at 50% 100%, #2a1448 0%, #0d0716 70%); }
  .sun { position: absolute; left: 50%; top: 46%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%;
    background: #030006;
    box-shadow: 0 0 0 3px rgba(190,150,255,.55), 0 0 24px 8px rgba(140,70,230,.55), 0 0 70px 26px rgba(90,30,170,.4);
    transition: box-shadow .6s; }
  .stage.lit .sun { box-shadow: 0 0 0 3px rgba(220,190,255,.85), 0 0 34px 14px rgba(160,90,255,.8), 0 0 90px 40px rgba(110,40,200,.6); }
  .rays { position: absolute; inset: 0; opacity: .35;
    background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(160,100,255,.35) 0 4deg, transparent 4deg 15deg);
    -webkit-mask: radial-gradient(circle at 50% 46%, transparent 52px, #000 70px, transparent 150px);
            mask: radial-gradient(circle at 50% 46%, transparent 52px, #000 70px, transparent 150px);
    animation: spin 40s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .type { text-align: center; font-size: 12px; letter-spacing: .3em; color: #b9a6dc; padding: 2px 0; border-bottom: 1px solid #3a2c5c; }
  .text { flex: 1; padding: 6px 8px; font-size: 13px; line-height: 1.55; border-radius: 8px; background: rgba(0,0,0,.35); border: 1px solid #3a2c5c; }
  .text b { color: #cfb4ff; }
  .flavor { margin-top: 6px; font-size: 11px; font-style: italic; color: #8f7fae; }

  /* 불꽃 캔버스: 카드보다 넓게 깔아서 카드 밖으로도 타오르게 */
  #fx { position: absolute; left: -90px; right: -90px; top: -190px; bottom: -30px; width: calc(100% + 180px); height: calc(100% + 220px); pointer-events: none; }

  .hint { position: fixed; bottom: 4%; left: 0; right: 0; text-align: center; font: 13px 'GmarketSans', 'Apple SD Gothic Neo', sans-serif; color: #8f7fae; letter-spacing: .15em; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="head"><span class="name">아마테라스</span><span class="cost">4</span></div>
    <div class="art"><div class="rays"></div><div class="sun"></div></div>
    <div class="type">마법 카드 — 속공</div>
    <div class="text">
      상대 필드의 몬스터 1장을 대상으로 발동한다.
      그 몬스터는 <b>꺼지지 않는 검은 불꽃</b>에 휩싸여, 매 턴 종료 시 500 데미지를 받는다.
      <div class="flavor">“태양마저 태워 없애는 불꽃.”</div>
    </div>
  </div>
  <canvas id="fx"></canvas>
</div>
<div class="hint">카드를 클릭하면 발동 / 다시 클릭하면 소멸</div>

<script src="amaterasu-flame.js"></script>
<script>
const stage = document.getElementById('stage');
const card = document.getElementById('card');
const canvas = document.getElementById('fx');

// 불꽃은 카드 아래쪽 가운데에서 솟아 카드 밖까지 타오른다. rate 0 = 꺼진 상태.
// 카드 글씨를 가리지 않도록 카드 양옆 가장자리에서 솟게 한다.
const fx = new AmaterasuFlame(canvas, { rate: 0, scale: 0.62, rise: 2.7, width: 40 });
function layout() {
  const mid = canvas.clientWidth / 2;
  fx.opts.xs = [mid - 152, mid + 152];
  fx.opts.y = canvas.clientHeight - 40;
}
layout();
addEventListener('resize', layout);
fx.start();

let lit = false;
card.addEventListener('click', () => {
  lit = !lit;
  stage.classList.toggle('lit', lit);
  fx.opts.rate = lit ? 6 : 0;
});

// 마우스 따라 살짝 기울어지는 카드
stage.addEventListener('mousemove', (e) => {
  const r = card.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width - 0.5;
  const ny = (e.clientY - r.top) / r.height - 0.5;
  card.style.setProperty('--ry', (nx * 14) + 'deg');
  card.style.setProperty('--rx', (-ny * 14) + 'deg');
});
stage.addEventListener('mouseleave', () => {
  card.style.setProperty('--rx', '0deg');
  card.style.setProperty('--ry', '0deg');
});
</script>
</body>
</html>
